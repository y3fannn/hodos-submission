    <circle cx="330.0" cy="390.0" r="236"/>
    <circle cx="314.5" cy="387.9" r="236"/>
    <circle cx="300.0" cy="382.0" r="236"/>
    <circle cx="287.6" cy="372.4" r="236"/>
    <circle cx="278.0" cy="360.0" r="236"/>
