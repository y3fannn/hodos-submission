<!-- The guilloché rosette engraved on banknotes, share certificates and watch dials: twenty-four
     overlapping circles whose interference draws the pattern. Used as a background on the vault
     screens at low opacity, so it is felt rather than seen. Its own file rather than a data URI, so
     the page's security rules need no exception for inline images. -->
