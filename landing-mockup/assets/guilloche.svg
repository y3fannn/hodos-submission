    <circle cx="330" cy="330" r="300"/>
    <circle cx="330" cy="330" r="288"/>
    <circle cx="390.0" cy="330.0" r="236"/>
    <circle cx="387.9" cy="345.5" r="236"/>
    <circle cx="382.0" cy="360.0" r="236"/>
    <circle cx="372.4" cy="372.4" r="236"/>
    <circle cx="360.0" cy="382.0" r="236"/>
